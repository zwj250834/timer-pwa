plugins {
  id 'com.android.application'
}

android {
  namespace 'com.zwj.timer'
  compileSdk 34

  defaultConfig {
    applicationId 'com.zwj.timer'
    minSdk 26
    targetSdk 34
    versionCode 1
    versionName '1.0'
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    abortOnError false
  }
}

// 刻意不依赖 AndroidX / Compose：全部用系统 SDK + 程序化界面，
// 构建只需要 AGP，不拉一长串依赖，出问题也容易查。

name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # core/ 里的逻辑不依赖 Android SDK，先用 JDK 跑一遍：快，而且报错信息最清楚
      - name: 逻辑自测
        id: logic
        continue-on-error: true
        run: |
          set -o pipefail
          cd android
          mkdir -p out
          {
            javac -encoding UTF-8 -d out \
              app/src/main/java/com/zwj/timer/core/*.java \
              tools/LogicTests.java
            java -cp out LogicTests
          } 2>&1 | tee ../ci-logic.txt

      - name: Setup Gradle
        if: steps.logic.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK licenses
        if: steps.logic.outcome == 'success'
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 构建 debug APK
        id: build
        if: steps.logic.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          cd android
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../ci-build.txt

      - name: 上传 APK 产物
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: timer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 固定地址：https://github.com/<owner>/<repo>/releases/download/android-latest/app-debug.apk
      - name: 发布到 Release
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android 最新构建
          make_latest: false
          body: |
            自动构建的调试版 APK（每次推送到 main 都会更新）。

            安装后倒计时交给系统的 AlarmManager，锁屏、息屏、Doze 都会准点响；
            首次启动按应用内提示授予「闹钟与提醒」「通知」「锁屏全屏提醒」权限。
          files: android/app/build/outputs/apk/debug/app-debug.apk

      # 构建日志对排查很关键，失败时把它推到 ci-logs 分支，方便直接读
      - name: 失败时把日志推到 ci-logs 分支
        if: failure() || steps.logic.outcome != 'success' || steps.build.outcome == 'failure'
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          { echo "=== 逻辑自测 ==="; [ -f ci-logic.txt ] && cat ci-logic.txt || echo "(未运行)"; echo; echo "=== 构建 ==="; [ -f ci-build.txt ] && cat ci-build.txt || echo "(未运行)"; } > ci-log.txt
          git checkout -b ci-logs
          git add -f ci-log.txt
          git commit -m "ci: 构建日志 ${{ github.run_number }}"
          git push -f origin ci-logs

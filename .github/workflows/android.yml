name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # core/ 里的逻辑不依赖 Android SDK，先用 JDK 跑一遍：快，而且报错信息最清楚
      - name: 逻辑自测
        id: logic
        continue-on-error: true
        run: |
          set -o pipefail
          cd android
          mkdir -p out
          {
            javac -encoding UTF-8 -d out \
              app/src/main/java/com/zwj/timer/core/*.java \
              tools/LogicTests.java
            java -cp out LogicTests
          } 2>&1 | tee ../ci-logic.txt

      - name: Setup Gradle
        if: steps.logic.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 签名密钥要跨次构建保持一致，否则每装一次新版都得先卸载。
      # 缓存保存在仓库的 Actions 缓存里（不是公开文件），过期后会自动重新生成。
      - name: 恢复调试签名密钥
        if: steps.logic.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 没有签名密钥就生成一个
        if: steps.logic.outcome == 'success'
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storetype PKCS12 \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        if: steps.logic.outcome == 'success'
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 构建 debug APK
        id: build
        if: steps.logic.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          cd android
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../ci-build.txt

      - name: 上传 APK 产物
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: timer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 打印签名信息（确认密钥一致）
        if: steps.build.outcome == 'success'
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null \
            | grep -E "所有者|Owner|SHA256|有效期|Valid" | head -4 || true

      # 固定地址：https://github.com/<owner>/<repo>/releases/download/android-latest/app-debug.apk
      - name: 发布到 Release
        id: release
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android 最新构建
          make_latest: false
          body: |
            自动构建的调试版 APK（每次推送到 main 都会更新）。

            安装后倒计时交给系统的 AlarmManager，锁屏、息屏、Doze 都会准点响；
            首次启动按应用内提示授予「闹钟与提醒」「通知」「锁屏全屏提醒」权限。
          files: android/app/build/outputs/apk/debug/app-debug.apk

      # 构建结果与日志都推到 ci-logs 分支：既能核对产物，又能在构建失败时直接读日志
      - name: 把构建结果写到 ci-logs 分支
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          {
            echo "commit: ${{ github.sha }}"
            echo "run: ${{ github.run_number }}"
            echo "logic: ${{ steps.logic.outcome }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "release: ${{ steps.release.outcome }}"
            apk=android/app/build/outputs/apk/debug/app-debug.apk
            if [ -f "$apk" ]; then
              echo "apk_sha256: $(sha256sum "$apk" | cut -d' ' -f1)"
              echo "apk_bytes: $(stat -c%s "$apk")"
            fi
            echo
            echo "=== 逻辑自测 ==="
            [ -f ci-logic.txt ] && cat ci-logic.txt || echo "(未运行)"
            echo
            echo "=== 构建 ==="
            [ -f ci-build.txt ] && cat ci-build.txt || echo "(未运行)"
          } > ci-status.txt
          cat ci-status.txt
          git checkout -b ci-logs 2>/dev/null || git checkout ci-logs
          git add -f ci-status.txt
          git commit -m "build ${{ github.run_number }}" || true
          git push -f origin ci-logs
